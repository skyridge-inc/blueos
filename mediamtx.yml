###############################################
# MediaMTX Configuration for BlueOS Extension
# - H.265 raw passthrough on RTSP port 8555
# - H.265 → H.264 transcode on RTSP port 8555
###############################################

# ====================
# Global Settings
# ====================
logLevel: info
api: no
metrics: no
pprof: no

# ====================
# RTSP Server
# ====================
rtspAddress: :8555

# ====================
# Single instance, single port
#   Both streams served on port 8555:
#     - rtsp://<blueos-ip>:8555/front_h265  (raw H.265 1080p60)
#     - rtsp://<blueos-ip>:8555/front        (transcoded H.264 720p30)
# ====================

# ====================
# WebRTC Settings
# ====================
webrtcAddress: :8889
webrtcICEServers: ["stun:stun.l.google.com:19302"]

# ====================
# Paths
# ====================
paths:
  # -------------------------------------------------
  # Path 1: Ingest the H.265 source from the camera
  # Available at: rtsp://<blueos-ip>:8555/front_h265
  # This is the raw, untouched H.265 1080p60 stream.
  # Source: e-con RouteCAM hevc (Main), 1920x1080, 60fps
  # -------------------------------------------------
  front_h265:
    source: rtsp://192.168.1.10:5005/routecam
    sourceProtocol: automatic
    sourceOnDemand: no

  # -------------------------------------------------
  # Path 2: H.265 → H.264 transcoded stream
  # Available at: rtsp://<blueos-ip>:8555/front
  #
  # Source is 1080p60 H.265. FFmpeg:
  #   - Decodes H.265 at 60fps (CPU-intensive)
  #   - Drops to 30fps (-vf fps=30) halving decode+encode work
  #   - Scales to 720p halving pixel count
  #   - Encodes H.264 baseline with slice threading
  #   - Publishes back to MediaMTX via TCP loopback
  # -------------------------------------------------
  front:
    runOnInit: >
      ffmpeg
      -fflags +genpts+igndts+nobuffer
      -flags low_delay
      -rtsp_transport udp
      -analyzeduration 500000
      -probesize 500000
      -i rtsp://localhost:8555/front_h265
      -map 0:v:0
      -pix_fmt yuv420p
      -vf "fps=30,scale=1280:720"
      -c:v libx264
      -preset ultrafast
      -tune zerolatency
      -profile:v baseline
      -level 3.1
      -b:v 1500k
      -maxrate 1500k
      -bufsize 750k
      -g 30
      -keyint_min 30
      -sc_threshold 0
      -bf 0
      -threads 4
      -thread_type slice
      -slices 4
      -max_muxing_queue_size 2048
      -rtsp_transport tcp
      -f rtsp rtsp://localhost:8555/front
    runOnInitRestart: yes