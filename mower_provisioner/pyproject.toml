[project]
name = "mower-provisioner"
version = "0.1.0"
description = "MAVLink fleet provisioning CLI for ArduPilot Rover/Mower vehicles"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pymavlink>=2.4.49",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
mower-provision = "mower_provisioner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-mock>=3.12", "respx>=0.22.0"]
