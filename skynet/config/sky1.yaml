hostname: sky1
vehicle_name: sky1
extensions:
- identifier: bluerobotics.cockpit
  tag: v1.17.0
  name: Cockpit Lite
  docker: bluerobotics/cockpit
  enabled: true
  permissions: '{"ExposedPorts": {"8000/tcp": {}}, "HostConfig": {"PortBindings":
    {"8000/tcp": [{"HostPort": ""}]}}}'
  user_permissions: ''
  auth: null
- identifier: williangalvani.mediamtx
  tag: v1.11.4
  name: MediaMTX
  docker: williangalvani/blueos-extension-mediamtx
  enabled: true
  permissions: '{"HostConfig":{"Privileged":true,"NetworkMode":"host","Binds":["/usr/blueos/extensions/mediamtx:/usr/blueos/extensions/mediamtx"]}}'
  user_permissions: ''
  auth: null
- identifier: blueos.major_tom
  tag: '2025-09-24'
  name: major_tom
  docker: public.ecr.aws/blueos/bcloud-agent
  enabled: true
  permissions: '{"HostConfig":{"NetworkMode":"host","Privileged":true,"Binds":["/var/logs:/var/logs","/:/host",
    "/var/run/docker.sock:/var/run/docker.sock"],"ExtraHosts":["blueos:host-gateway"]}}'
  user_permissions: ''
  auth: null
bag:
  vehicle.image_path:
    url: null
  major_tom:
    token: f720c0e370f48e73b93eb4f62b20ac379fc12373
    inventory_url: https://blueos.cloud/
  # Cockpit (v1.17.0) per-user settings, stored at cockpit/settings/<user>/<key>.
  # A slash-separated key sets only that one setting (BlueOS bag uses dpath.new),
  # so Cockpit's other settings and layouts on the vehicle are left alone.
  # Cockpit prefers the BlueOS value on conflict; it asks when the same user
  # reconnects to the same vehicle with a different local value.
  cockpit/settings/sky1/cockpit-custom-rtc-config:
    enabled: true
    data:
      bundlePolicy: max-bundle
      # RTCIceServer objects; bare "stun:..." strings make new RTCPeerConnection() throw
      iceServers:
      - urls: stun:stun.l.google.com:19302
  cockpit/settings/sky1/cockpit-streams-correspondency:
  - name: front           # Cockpit's internal stream name (video widgets select this)
    externalId: front     # mavlink-camera-manager stream name (video_streams below)
  # Auto-fetch pins the allowed ICE IPs to one vehicle address (it picked eth1's
  # 192.168.10.1, the camera subnet), so browsers on NetBird/LAN get no reachable
  # candidate and ICE fails. Empty list = accept every candidate MCM offers.
  cockpit/settings/sky1/cockpit-enable-auto-ice-ip-fetch: false
  cockpit/settings/sky1/cockpit-allowed-stream-ips: []
  # Imperial units. Cockpit v1.17's only unit setting is distance (meters|feet);
  # it has no temperature or speed unit setting.
  cockpit/settings/sky1/cockpit-display-unit-preferences:
    distance: feet
# Options set on every widget of that component in the user's saved Cockpit
# layouts (all profiles and views); other widget options are left alone.
cockpit_widget_options:
  sky1:                      # Cockpit user
    VideoPlayer:
      videoFitStyle: fill    # stretch to the widget; Cockpit's default is cover (crops)
    VeryGenericIndicator:
    # The ROV layout's "Water Temp" (SCALED_PRESSURE2) is the Cube's heated
    # barometer, not water or air, so label it Cube Temp. Kept in C: the
    # value is centi-degrees C, and the widget can only scale (no F offset).
    - match:
        variableName: [SCALED_PRESSURE2/temperature, CubeTempF]
      set:
        displayName: Cube Temp
        variableName: SCALED_PRESSURE2/temperature
        variableUnit: °C
        variableMultiplier: 0.01
        decimalPlaces: 1
network:
  ethernet:
  - name: eth0
    addresses: []   # DHCP client (Starlink): lease is dynamic, never captured or applied
  - name: eth1
    addresses:
    - ip: 192.168.10.1
      mode: server
  - name: usb0
    addresses:
    - ip: 192.168.3.1
      mode: server
  - name: wt0
    addresses:
    - ip: 100.82.255.246
      mode: unmanaged
  wifi_saved:
  - networkid: 0
    ssid: '007'
    bssid: null
    flags: null
    nm_id: /org/freedesktop/NetworkManager/Settings/1
    nm_uuid: d3dbef53-a8a1-473f-bd78-a4d7403e9bbe
    interface: wlan1
    band: bg
  hotspot: true
  dhcp_reservations:
  - mac: 64:35:1c:00:f0:79
    ip: 192.168.10.2
    hostname: routecam
autopilot_autostart: true   # udev starts the BlueOS autopilot when the Cube is plugged in after boot
mediamtx:
  config_path: extensions/mediamtx/mediamtx.yml
  config:
    logLevel: info
    rtspAddress: :8555
    paths:
      front:
        source: rtsp://192.168.10.2:5005/routecam
        sourceProtocol: udp
        sourceOnDemand: false
        # The camera's H.265 SPS has no VUI timing (its 60 fps is only in the VPS),
        # and mavlink-camera-manager refuses caps without a framerate. Republish
        # with the timing written into the SPS — header rewrite only, no re-encode.
        runOnReady: >-
          ffmpeg -hide_banner -loglevel error -rtsp_transport tcp
          -i rtsp://localhost:8555/front -c copy -bsf:v hevc_metadata=tick_rate=60/1
          -rtsp_transport tcp -f rtsp rtsp://localhost:8555/front_cockpit
        runOnReadyRestart: true
      front_cockpit:
        source: publisher
video_streams:   # mavlink-camera-manager streams; Cockpit plays these over WebRTC
- name: front
  source: Redirect   # relay the MediaMTX path below, so MediaMTX stays the camera's only client
  endpoints:
  - rtsp://127.0.0.1:8555/front_cockpit
# Battery monitors on the Cube's power ports; skynet turns each entry into the
# port's BATT*/BATT2* params (src/skynet/battery.py has the presets).
batteries:
- port: power1               # Holybro PM02 V3 6-pin -> Cube POWER1 (BATT_*)
  sensor: holybro_pm02_v3    # analog V/I; senses the 24 V electronics bus only
  chemistry: lifepo4         # 12.8 V LiFePO4 blocks: low 12.8 V, critical 12.0 V each
  batteries_in_series: 2     # the 24 V tap = 2 of the 4 x 12 V string -> low 25.6, critical 24.0
  low_action: hold           # below low for BATT_LOW_TIMER (10 s): Hold, tracks stop
  critical_action: hold
  # capacity_mah unset (0): the sensor sees only the 24 V load, not the 48 V tracks,
  # and the generator recharges, so a coulomb-counted remaining % would be wrong.
  # volt_mult / amp_per_volt default to Holybro's nominal 18.182 / 36.364; replace
  # with multimeter-calibrated values (download copies them from the Cube).
autopilot_params:   # overrides on top of autopilot_base.yaml
  # ArduPilot has no string name param. BRD_SERIAL_NUM is a free user-set integer
  # (no effect on flight code), so it holds the rover number: sky1 -> 1.
  BRD_SERIAL_NUM: 1
