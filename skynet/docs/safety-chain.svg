<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d6452f"/></marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:1.6}
      .key{fill:#eef6ff;stroke:#1e40af;stroke-width:2}
      .stop{fill:#fef2f2;stroke:#dc2626;stroke-width:2}
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#334155}
      .w{font-size:12px;font-weight:700;fill:#b45309}
      .lbl{font-size:11px;fill:#475569}
      .pwr{stroke:#d6452f;stroke-width:3;fill:none}
      .dat{stroke:#2563eb;stroke-width:2.5;fill:none}
      .wifi{stroke:#16a34a;stroke-width:2.5;fill:none;stroke-dasharray:7 5}
      .ctl{stroke:#7c3aed;stroke-width:2;fill:none;stroke-dasharray:4 4}
      .fuse{fill:#fff7ed;stroke:#c2410c;stroke-width:1.2}
    </style>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="20" y="34" font-size="22" font-weight="700" fill="#0f172a">Safety chain: E-stop + deadman, energise to run</text>
  <text x="20" y="58" class="s">Every device in the coil circuit must be closed for safety relay K1 to pull in. Any one opens, or power or a wire is lost: K1 drops, tracks and blades are disabled, and the Cube goes to Hold + disarmed.</text>

  <!-- Radios -->
  <rect x="430" y="82" width="210" height="72" rx="8" class="stop"/>
  <text x="442" y="104" class="t">Wireless E-stop handheld</text>
  <text x="442" y="122" class="lbl">separate radio and battery</text>
  <text x="442" y="138" class="lbl">latching red button, held by the observer</text>
  <path d="M535,154 V228" class="wifi"/>
  <text x="543" y="196" class="lbl">heartbeat</text>

  <rect x="665" y="82" width="205" height="72" rx="8" class="box"/>
  <text x="677" y="104" class="t">RC receiver</text>
  <text x="677" y="122" class="lbl">SBUS → Cube RCIN</text>
  <text x="677" y="138" class="lbl">ch5 PWM → deadman relay</text>
  <path d="M767,154 V228" class="ctl" marker-end="url(#arP)"/>
  <text x="775" y="196" class="lbl">ch5 PWM</text>

  <rect x="920" y="82" width="260" height="72" rx="8" class="box"/>
  <text x="932" y="104" class="t">RC transmitter (driver)</text>
  <text x="932" y="122" class="lbl">ch1 throttle, ch2 steer, ch8 mode</text>
  <text x="932" y="138" class="lbl">ch5 momentary switch = deadman</text>
  <path d="M920,112 H872" class="wifi"/>

  <!-- Coil circuit -->
  <text x="20" y="218" font-size="13" font-weight="700" fill="#0f172a">K1 coil circuit: all in series</text>
  <rect x="20" y="230" width="140" height="80" rx="8" class="box"/>
  <text x="32" y="254" class="t">Coil supply</text>
  <text x="32" y="274" class="s">12/24 V, own</text>
  <text x="32" y="290" class="s">fused branch</text>
  <line x1="160" y1="270" x2="213" y2="270" class="pwr"/>
  <rect x="171" y="261" width="30" height="18" rx="3" class="fuse"/>

  <rect x="215" y="230" width="185" height="80" rx="8" class="stop"/>
  <text x="227" y="254" class="t">Rover E-stop button</text>
  <text x="227" y="274" class="s">NC, latching mushroom</text>
  <text x="227" y="290" class="s">twist to reset</text>
  <line x1="400" y1="270" x2="428" y2="270" class="pwr" marker-end="url(#arR)"/>

  <rect x="430" y="230" width="210" height="80" rx="8" class="stop"/>
  <text x="442" y="254" class="t">Wireless E-stop receiver</text>
  <text x="442" y="274" class="s">NO relay, closed on heartbeat</text>
  <text x="442" y="290" class="s">opens &lt; 0.5 s, latches</text>
  <line x1="640" y1="270" x2="663" y2="270" class="pwr" marker-end="url(#arR)"/>

  <rect x="665" y="230" width="205" height="80" rx="8" class="key"/>
  <text x="677" y="254" class="t">Deadman relay</text>
  <text x="677" y="274" class="s">RC switch module, NO</text>
  <text x="677" y="290" class="s">closed only while ch5 held</text>
  <line x1="870" y1="270" x2="908" y2="270" class="pwr" marker-end="url(#arR)"/>

  <rect x="910" y="230" width="150" height="80" rx="8" class="key"/>
  <text x="922" y="254" class="t">K1 safety relay</text>
  <text x="922" y="274" class="s">coil; 4 NO contacts</text>
  <text x="922" y="290" class="s">K1a, K1b, K1c, K1d</text>
  <line x1="1060" y1="270" x2="1110" y2="270" class="pwr"/>
  <line x1="1110" y1="270" x2="1110" y2="286" stroke="#334155" stroke-width="2"/>
  <line x1="1096" y1="286" x2="1124" y2="286" stroke="#334155" stroke-width="2"/>
  <line x1="1101" y1="292" x2="1119" y2="292" stroke="#334155" stroke-width="2"/>
  <line x1="1106" y1="298" x2="1114" y2="298" stroke="#334155" stroke-width="2"/>
  <text x="1130" y="292" class="lbl">GND</text>

  <!-- K1 contacts -->
  <path d="M985,310 V372" class="ctl"/>
  <path d="M140,372 H1040" class="ctl"/>
  <text x="600" y="366" class="lbl">K1 contacts move together: closed only while the coil is energised</text>
  <path d="M140,372 V398" class="ctl" marker-end="url(#arP)"/>
  <path d="M410,372 V398" class="ctl" marker-end="url(#arP)"/>
  <path d="M685,372 V398" class="ctl" marker-end="url(#arP)"/>
  <path d="M1040,372 V398" class="ctl" marker-end="url(#arP)"/>

  <rect x="20" y="400" width="240" height="50" rx="6" class="box"/>
  <text x="32" y="421" class="t">K1a</text><text x="72" y="421" class="s">NO contact</text>
  <text x="32" y="439" class="lbl">closes the track controller ENABLE</text>
  <rect x="290" y="400" width="240" height="50" rx="6" class="box"/>
  <text x="302" y="421" class="t">K1b</text><text x="342" y="421" class="s">NO contact</text>
  <text x="302" y="439" class="lbl">closes the blade controller ENABLE</text>
  <rect x="560" y="400" width="250" height="50" rx="6" class="box"/>
  <text x="572" y="421" class="t">K1c</text><text x="612" y="421" class="s">optional</text>
  <text x="572" y="439" class="lbl">drives a DC contactor on motor power</text>
  <rect x="905" y="400" width="275" height="50" rx="6" class="box"/>
  <text x="917" y="421" class="t">K1d</text><text x="957" y="421" class="s">NO contact to GND</text>
  <text x="917" y="439" class="lbl">grounds Cube AUX OUT 1 + 2 while closed</text>

  <path d="M140,450 V538" class="pwr" marker-end="url(#arR)"/>
  <path d="M410,450 V538" class="pwr" marker-end="url(#arR)"/>
  <path d="M685,450 V538" class="pwr" marker-end="url(#arR)"/>
  <path d="M1040,450 V538" class="ctl" marker-end="url(#arP)"/>

  <!-- Loads -->
  <rect x="20" y="540" width="240" height="90" rx="8" class="box"/>
  <text x="32" y="564" class="t">Track motor controller</text>
  <text x="32" y="584" class="s">ENABLE ← K1a</text>
  <text x="32" y="600" class="s">ch1/ch2 ← Cube OUT1/OUT2</text>
  <text x="32" y="618" class="lbl">mixed mode, 1500 µs = stop</text>
  <rect x="290" y="540" width="240" height="90" rx="8" class="box"/>
  <text x="302" y="564" class="t">Blade motor controller</text>
  <text x="302" y="584" class="s">ENABLE ← K1b</text>
  <text x="302" y="600" class="s">blades stop with the tracks</text>
  <text x="302" y="618" class="lbl">usually the bigger hazard</text>
  <rect x="560" y="540" width="250" height="90" rx="8" class="box"/>
  <text x="572" y="564" class="t">Motor power contactor</text>
  <text x="572" y="584" class="s">optional, DC-rated, driven by K1c</text>
  <text x="572" y="600" class="s">size for the stall current</text>
  <text x="572" y="618" class="lbl">follow the controller manual on regen</text>
  <rect x="905" y="540" width="275" height="90" rx="8" class="key"/>
  <text x="917" y="564" class="t">Cube Orange+</text>
  <text x="917" y="584" class="s">AUX OUT 1+2 jumpered ← K1d</text>
  <text x="917" y="600" class="s">open: Hold (BTN_FUNC1=54)</text>
  <text x="917" y="618" class="s">+ Disarm (BTN_FUNC2=81)</text>

  <path d="M870,142 H893 V604 H903" class="dat" marker-end="url(#arB)"/>
  <text x="887" y="500" class="lbl" text-anchor="end">SBUS</text>
  <path d="M1040,630 V660 H140 V632" class="ctl" marker-end="url(#arP)"/>
  <text x="600" y="654" class="lbl" text-anchor="middle">Cube OUT1 = throttle, OUT2 = steer (PWM); Hold sends 1500 on both</text>

  <!-- Notes -->
  <rect x="20" y="690" width="565" height="118" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="32" y="712" font-size="13" font-weight="700" fill="#991b1b">Fail-safe by design</text>
  <text x="32" y="732" class="s">• Energise to run: lost coil power, a broken wire or a failed relay all stop.</text>
  <text x="32" y="750" class="s">• RC receiver failsafe: "no pulses" (or ch5 = released), never "hold last".</text>
  <text x="32" y="768" class="s">• E-stops latch. After a reset the Cube is in Manual + disarmed: re-arm on purpose.</text>
  <text x="32" y="786" class="s">• Slopes: unpowered tracks may freewheel; add spring-applied brakes if needed.</text>
  <text x="32" y="802" class="w">Cut controller ENABLE inputs first; cutting battery power is optional (K1c).</text>

  <rect x="605" y="690" width="575" height="118" rx="8" fill="#eef6ff" stroke="#1e40af"/>
  <text x="617" y="712" font-size="13" font-weight="700" fill="#1e3a8a">Cube feedback wiring (K1d)</text>
  <text x="617" y="732" class="s">• Jumper AUX OUT 1 and 2. K1d connects them to GND while the chain is closed.</text>
  <text x="617" y="750" class="s">• Chain open or wire broken: the pull-up reads HIGH, so Hold + Disarm.</text>
  <text x="617" y="768" class="s">• Pins are 3.3 V logic: a dry contact to GND only, never apply voltage.</text>
  <text x="617" y="786" class="s">• SERVO9/10_FUNCTION = -1 (GPIO); reboot the Cube after uploading.</text>
  <text x="617" y="802" class="s">• Applied at boot too, unlike the RC5 Hold switch.</text>
</svg>
