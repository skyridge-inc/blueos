<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 830" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d6452f"/></marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f9488"/></marker>
    <marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:1.6}
      .key{fill:#eef6ff;stroke:#1e40af;stroke-width:2}
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#334155}
      .w{font-size:12px;font-weight:700;fill:#b45309}
      .lbl{font-size:11px;fill:#475569}
      .pwr{stroke:#d6452f;stroke-width:3;fill:none}
      .dat{stroke:#2563eb;stroke-width:2.5;fill:none}
      .poe{stroke:#0f9488;stroke-width:4;fill:none}
      .wifi{stroke:#16a34a;stroke-width:2.5;fill:none;stroke-dasharray:7 5}
      .ctl{stroke:#7c3aed;stroke-width:2;fill:none;stroke-dasharray:4 4}
      .fuse{fill:#fff7ed;stroke:#c2410c;stroke-width:1.2}
    </style>
  </defs>

  <rect width="1220" height="830" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">Rover comms &amp; power: minimal-power layout, no network switch (24 V electronics bus)</text>
  <text x="30" y="60" class="s">Pi 5 is the router: Starlink = WAN 1, nearby Wi-Fi = WAN 2 (failover), camera on its own LAN port. Pi cuts Starlink power when local Wi-Fi is good.</text>

  <!-- Battery -->
  <rect x="30" y="360" width="170" height="110" rx="10" class="box"/>
  <rect x="190" y="395" width="10" height="40" fill="#334155"/>
  <text x="45" y="392" class="t">24 V Battery</text>
  <text x="45" y="412" class="s">20–29 V (LiFePO4 8S /</text>
  <text x="45" y="428" class="s">Li-ion 7S), electronics</text>
  <text x="45" y="444" class="s">tap; motors separate</text>

  <!-- Main fuse -->
  <line x1="200" y1="415" x2="250" y2="415" class="pwr"/>
  <rect x="209" y="406" width="32" height="18" rx="3" class="fuse"/>
  <text x="214" y="419" font-size="10" fill="#c2410c">10 A</text>

  <!-- PM02 -->
  <rect x="250" y="375" width="160" height="80" rx="8" class="box"/>
  <text x="262" y="400" class="t">Holybro PM02 V3</text>
  <text x="262" y="420" class="s">Battery V/I sensing</text>
  <text x="262" y="436" class="s">+ 5.2 V BEC for Cube</text>
  <line x1="410" y1="415" x2="430" y2="415" class="pwr"/>

  <!-- Fuse block -->
  <rect x="430" y="120" width="40" height="430" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
  <text x="456" y="335" font-size="13" font-weight="700" fill="#c2410c" transform="rotate(-90 456 335)" text-anchor="middle">FUSE BLOCK (24 V)</text>

  <!-- Branch 1: Relay -> Starlink -->
  <line x1="470" y1="135" x2="518" y2="135" class="pwr" marker-end="url(#arR)"/>
  <text x="478" y="127" font-size="10" fill="#c2410c">5 A</text>
  <rect x="520" y="105" width="180" height="60" rx="8" class="box"/>
  <text x="532" y="126" class="t">3.3 V relay (NO)</text>
  <text x="532" y="143" class="s">Breaks +24 V to Starlink</text>
  <text x="532" y="158" class="lbl">coil ~0.4 W, only while on</text>
  <line x1="700" y1="135" x2="798" y2="135" class="pwr" marker-end="url(#arR)"/>
  <text x="712" y="152" class="lbl">5.5×2.1 pigtail</text>

  <!-- Starlink Mini -->
  <rect x="800" y="90" width="220" height="110" rx="10" class="key"/>
  <text x="814" y="116" class="t">Starlink Mini</text>
  <text x="814" y="136" class="s">Bypass mode (built-in Wi-Fi off)</text>
  <text x="814" y="152" class="s">12–48 V DC in</text>
  <text x="814" y="172" class="w">25–40 W (biggest load)</text>
  <path d="M1020,110 L1090,80" class="wifi"/>
  <text x="1094" y="78" class="lbl">satellites</text>

  <!-- Starlink -> USB GbE -> Pi -->
  <line x1="910" y1="200" x2="910" y2="288" class="dat" marker-end="url(#arB)"/>
  <text x="918" y="250" class="lbl">Cat6 (RJ45)</text>
  <rect x="835" y="290" width="150" height="40" rx="6" class="box"/>
  <text x="846" y="307" font-size="12" font-weight="700" fill="#0f172a">USB 3 GbE adapter</text>
  <text x="846" y="322" class="lbl">eth1: WAN 1</text>
  <line x1="910" y1="330" x2="910" y2="398" class="dat" marker-end="url(#arB)"/>
  <text x="918" y="370" class="lbl">USB 3</text>

  <!-- Raspberry Pi 5 -->
  <rect x="760" y="400" width="230" height="160" rx="10" class="key"/>
  <text x="774" y="426" class="t">Raspberry Pi 5 (router)</text>
  <text x="774" y="448" class="s">eth1  = Starlink (WAN 1, primary)</text>
  <text x="774" y="466" class="s">wlan0 = nearby Wi-Fi (WAN 2)</text>
  <text x="774" y="484" class="s">eth0  = camera LAN + DHCP/NAT</text>
  <text x="774" y="502" class="s">Health-checked failover</text>
  <text x="774" y="520" class="s">GPIO17 → Starlink relay</text>
  <text x="774" y="544" class="w">3–7 W</text>

  <!-- Branch 2: PoE injector -> camera -->
  <line x1="470" y1="335" x2="518" y2="335" class="pwr" marker-end="url(#arR)"/>
  <text x="478" y="327" font-size="10" fill="#c2410c">3 A</text>
  <rect x="520" y="300" width="180" height="70" rx="8" class="box"/>
  <text x="532" y="322" class="t">PoE+ injector</text>
  <text x="532" y="340" class="s">12–60 V in → 50 V PoE</text>
  <text x="532" y="356" class="s">data in ← Pi eth0</text>
  <path d="M760,450 H730 V355 H702" class="dat" marker-end="url(#arB)"/>
  <text x="706" y="395" class="lbl">eth0</text>
  <line x1="610" y1="300" x2="610" y2="252" class="poe" marker-end="url(#arT)"/>
  <text x="620" y="282" class="lbl">PoE + data</text>
  <rect x="520" y="190" width="180" height="60" rx="8" class="box"/>
  <text x="532" y="214" class="t">IP camera</text>
  <text x="532" y="234" class="w">802.3af · 3–6 W</text>

  <!-- GPIO control to relay -->
  <path d="M780,400 V182 H660 V167" class="ctl" marker-end="url(#arP)"/>
  <text x="702" y="177" class="lbl" fill="#7c3aed">GPIO17 (3.3 V)</text>

  <!-- Branch 3: Buck -> Pi -->
  <line x1="470" y1="515" x2="518" y2="515" class="pwr" marker-end="url(#arR)"/>
  <text x="478" y="507" font-size="10" fill="#c2410c">3 A</text>
  <rect x="520" y="485" width="180" height="60" rx="8" class="box"/>
  <text x="532" y="508" class="t">Buck 24 V → 5 V 5 A</text>
  <text x="532" y="527" class="s">USB-C out, 8–32 V in</text>
  <line x1="700" y1="525" x2="758" y2="525" class="pwr" marker-end="url(#arR)"/>
  <text x="708" y="544" class="lbl">USB-C</text>

  <!-- Nearby Wi-Fi -->
  <rect x="1050" y="440" width="150" height="70" rx="10" class="box"/>
  <text x="1062" y="465" class="t">Nearby Wi-Fi</text>
  <text x="1062" y="484" class="s">backup internet</text>
  <text x="1062" y="500" class="lbl">(optional USB antenna)</text>
  <line x1="990" y1="475" x2="1048" y2="475" class="wifi"/>
  <text x="996" y="467" class="lbl">wlan0</text>

  <!-- PM02 -> Cube -->
  <line x1="330" y1="455" x2="330" y2="608" class="pwr" marker-end="url(#arR)"/>
  <text x="338" y="530" class="lbl">6-pin: 5.2 V +</text>
  <text x="338" y="544" class="lbl">V/I → POWER1</text>

  <!-- Cube Orange+ -->
  <rect x="230" y="610" width="170" height="90" rx="10" class="box"/>
  <text x="244" y="636" class="t">Cube Orange+</text>
  <text x="244" y="656" class="s">ArduPilot Rover</text>
  <text x="244" y="684" class="w">~1.5–2.5 W</text>

  <!-- Pi <-> Cube MAVLink -->
  <path d="M800,560 V655 H402" class="dat" marker-end="url(#arB)"/>
  <text x="430" y="648" class="lbl">TELEM2 ↔ Pi UART (GPIO14/15): MAVLink, no USB power backfeed</text>

  <!-- Legend -->
  <rect x="430" y="690" width="390" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="444" y="712" font-size="13" font-weight="700" fill="#0f172a">Legend</text>
  <line x1="444" y1="732" x2="484" y2="732" class="pwr"/><text x="492" y="736" class="s">DC power</text>
  <line x1="630" y1="732" x2="670" y2="732" class="dat"/><text x="678" y="736" class="s">Ethernet / data</text>
  <line x1="444" y1="760" x2="484" y2="760" class="poe"/><text x="492" y="764" class="s">PoE (power + data)</text>
  <line x1="630" y1="760" x2="670" y2="760" class="wifi"/><text x="678" y="764" class="s">Wireless link</text>
  <line x1="444" y1="788" x2="484" y2="788" class="ctl"/><text x="492" y="792" class="s">Control signal</text>
  <rect x="639" y="781" width="22" height="14" rx="2" class="fuse"/><text x="678" y="792" class="s">Fuse (ATC blade)</text>

  <!-- Other battery voltages -->
  <rect x="20" y="715" width="400" height="95" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="32" y="737" font-size="13" font-weight="700" fill="#92400e">Using a different battery?</text>
  <text x="32" y="757" class="s">12 V: works as drawn (about 2× the current, use 14 AWG).</text>
  <text x="32" y="773" class="s">36 / 48 V: add a 36/48 → 24 V buck ahead of the fuse block.</text>
  <text x="32" y="789" class="s">5 V buck max 32 V, relay max 30 V, Starlink Mini max 48 V;</text>
  <text x="32" y="803" class="s">a charged "48 V" pack sits at ~54–58 V.</text>

  <!-- Power budget -->
  <rect x="835" y="590" width="365" height="220" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="851" y="614" font-size="14" font-weight="700" fill="#14532d">Power budget (at battery, incl. losses)</text>
  <text x="851" y="638" class="s">Starlink Mini</text><text x="1185" y="638" class="s" text-anchor="end">25–40 W</text>
  <text x="851" y="656" class="s">IP camera + PoE injector</text><text x="1185" y="656" class="s" text-anchor="end">4–7 W</text>
  <text x="851" y="674" class="s">Pi 5 + buck + USB GbE</text><text x="1185" y="674" class="s" text-anchor="end">4–9 W</text>
  <text x="851" y="692" class="s">Cube Orange+ via PM02</text><text x="1185" y="692" class="s" text-anchor="end">1.5–2.5 W</text>
  <line x1="851" y1="702" x2="1185" y2="702" stroke="#86efac"/>
  <text x="851" y="722" font-size="13" font-weight="700" fill="#0f172a">Starlink mode</text><text x="1185" y="722" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">~35–58 W</text>
  <text x="851" y="742" font-size="13" font-weight="700" fill="#15803d">Local Wi-Fi mode (Starlink off)</text><text x="1185" y="742" font-size="13" font-weight="700" fill="#15803d" text-anchor="end">~10–18 W</text>
  <text x="851" y="766" class="s">About 3× longer runtime while Wi-Fi is in range.</text>
  <text x="851" y="784" class="s">No network switch: saves ~1–3 W and a box.</text>
  <text x="851" y="802" class="s">Starlink needs ~1–3 min to reconnect after power-on.</text>
</svg>
